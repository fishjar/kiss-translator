    <noscript>
      <header>
        <h1>KISS Translator 简约翻译 - 简约开源的双语对照翻译工具</h1>
        <p>KISS Translator 是一个为极客和深度阅读者打造的双语对照翻译浏览器扩展与油猴脚本。</p>
      </header>
      <main>
        <h2>核心功能特性</h2>
        <ul>
          <li><strong>网页双语翻译</strong>：保持原始排版，在原文旁显示译文，支持仅显示译文模式。</li>
          <li><strong>划词查词与悬停翻译</strong>：支持多服务对比、柯林斯生词本收藏。</li>
          <li><strong>YouTube 双语字幕</strong>：基础合并算法与 AI 语义断句，提供字幕悬停查词与 AI 视频总结。</li>
          <li><strong>文件翻译</strong>：支持 PDF 原文解析与表格公式识别、EPUB 电子书双语对照阅读导出、TXT/Markdown 与图片 OCR 翻译。</li>
          <li><strong>本地 AI 与插件生态</strong>：端侧离线轻量模型支持，通过开源插件接入任意自定义 API。</li>
        </ul>
        <h2>支持的客户端</h2>
        <p>支持 Chrome、Edge、Firefox、Thunderbird 扩展及 Tampermonkey / Violentmonkey 油猴脚本与 iOS Safari。</p>
      </main>
