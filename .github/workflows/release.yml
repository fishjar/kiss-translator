name: publish release version

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # aifw 子模块用于构建 public/aifw-js 运行期产物
          submodules: recursive
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - name: Setup Rust (wasm target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"
      - run: pnpm install
      - name: Build aifw runtime from submodule
        run: pnpm build:aifw --strict
      - run: pnpm build+zip
      - uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: build

  deploy-web:
    needs: build
    permissions:
      contents: write
    concurrency:
      group: deploy-website
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: build
      - name: Verify built aifw assets
        shell: bash
        run: |
          set -euo pipefail
          test -s build/web/aifw-js/aifw-js.js
          test -s build/web/aifw-js/wasm/liboneaifw_core.wasm
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build/web

  create-release:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Extract release notes
        shell: bash
        run: |
          set -euo pipefail
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          : > "$NOTES_FILE"
          if [ -f CHANGELOG.md ]; then
            # 最新日志在文件最上方：从第一个 "## " 之后开始，遇到下一个 "## " 停止
            awk '/^## / {if (p) exit; p=1; next} p' CHANGELOG.md > "$NOTES_FILE"
          fi
          if [ ! -s "$NOTES_FILE" ]; then
            echo "Release ${{ github.ref_name }}" > "$NOTES_FILE"
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Release ${{ github.ref_name }}" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --verify-tag

  upload-release:
    needs: [build, create-release]
    permissions:
      contents: write
    strategy:
      matrix:
        client: ["chrome", "edge", "firefox", "userscript", "thunderbird"]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: build
      - name: Upload ${{ matrix.client }} asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ASSET="kiss-translator_${{ github.ref_name }}_${{ matrix.client }}.zip"
          cp "build/${{ matrix.client }}.zip" "$ASSET"
          gh release upload "${{ github.ref_name }}" "$ASSET" --clobber
