name: PR checks and review builds

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CI: "true"
  NODE_PATH: ${{ github.workspace }}/node_modules/.pnpm/node_modules

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run unit tests
        run: pnpm exec react-app-rewired test --watchAll=false --runInBand

  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [chrome, firefox, thunderbird, web]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build distribution
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: pnpm exec zx src/scripts/build-task.mjs --target="$BUILD_TARGET"
      - name: Build Edge package
        if: matrix.target == 'chrome'
        run: pnpm run build:edge
      - name: Build iOS userscript
        if: matrix.target == 'web'
        run: pnpm run build:userscript-ios
      - name: Package review builds
        env:
          BUILD_TARGET: ${{ matrix.target }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        shell: python
        run: |
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import zipfile

          target = os.environ["BUILD_TARGET"]
          revision = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          version = json.loads(Path("package.json").read_text())["version"]
          targets = ["chrome", "edge"] if target == "chrome" else ["userscript" if target == "web" else target]
          output = Path("review-artifacts")
          output.mkdir()
          checksums = []
          for client in targets:
              source = Path("build") / client
              required = ["kiss-translator.user.js", "kiss-translator-ios-safari.user.js"] if client == "userscript" else ["manifest.json", "popup.html", "options.html", "content.js", "background.js"]
              for filename in required:
                  if not (source / filename).is_file():
                      raise SystemExit(f"Missing {client} artifact: {filename}")
              archive = output / f"kiss-translator-{version}-{revision[:8]}-{client}.zip"
              with zipfile.ZipFile(archive, "w", zipfile.ZIP_DEFLATED) as bundle:
                  for file in sorted(source.rglob("*")):
                      if file.is_file():
                          bundle.write(file, file.relative_to(source))
              checksums.append(f"{hashlib.sha256(archive.read_bytes()).hexdigest()}  {archive.name}")
          (output / "SHA256SUMS.txt").write_text("\n".join(checksums) + "\n")
          (output / "BUILD_INFO.json").write_text(json.dumps({
              "revision": revision,
              "version": version,
              "targets": targets,
              "pull_request": os.environ["PR_URL"],
          }, indent=2) + "\n")
      - name: Upload review packages
        uses: actions/upload-artifact@v4
        with:
          name: review-build-pr-${{ github.event.pull_request.number }}-${{ matrix.target }}
          path: review-artifacts/
          if-no-files-found: error
          retention-days: 14

  gate:
    name: CI gate
    if: always()
    needs: [test, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require successful tests and builds
        env:
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          test "$TEST_RESULT" = success
          test "$BUILD_RESULT" = success
